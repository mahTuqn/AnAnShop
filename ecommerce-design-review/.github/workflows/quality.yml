name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: anan_shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d anan_shop"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: production
    env:
      ADMIN_DEMO_MODE: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/anan_shop?schema=public
      ORDER_LOOKUP_SECRET: ci-only-order-lookup-secret-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: production/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../database/schema.sql
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../database/migrations/0002_checkout_inventory_functions.sql
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../database/migrations/0003_store_settings_and_refund_idempotency.sql
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../database/migrations/0004_audit_permission.sql
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../database/migrations/0005_customer_account_and_order_invariants.sql
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../database/migrations/0006_content_permissions.sql
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../database/migrations/0007_notification_read_state.sql
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../database/migrations/0008_fulfillment_lifecycle.sql
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../database/seed.sql
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../database/demo-catalog.seed.sql
      - run: npm audit --omit=dev
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium --workers=1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: production/playwright-report
          if-no-files-found: ignore

  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  legacy-compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run build
